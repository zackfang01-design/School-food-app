<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>學校115廚餘總重紀錄表</title>
<style>
:root{--main:#0f766e;--light:#ecfeff;--line:#cbd5e1;--text:#173042;--danger:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:#f3f7f7;color:var(--text)}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0 0 12px;font-weight:800}.sub{font-size:13px;opacity:.9}
.wrap{max-width:900px;margin:auto;padding:14px 12px 40px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #0000000d}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls label{font-size:12px;color:#64748b}
input,select,button{font:inherit} input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.daytabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.daytabs button{border:0;background:#e2e8f0;color:#334155;border-radius:10px;padding:10px 14px;white-space:nowrap;font-weight:700}.daytabs button.active{background:var(--main);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f0fdfa;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;color:var(--main)}.stat span{font-size:12px;color:#64748b}
.entry{display:grid;grid-template-columns:70px 1fr 92px 42px;gap:7px;align-items:center;margin-bottom:8px}.entry .group{background:#f8fafc;padding:11px 7px;border-radius:10px;text-align:center;font-weight:700}.entry button{height:42px;border:0;border-radius:10px;background:#fee2e2;color:var(--danger);font-size:20px}
.add{width:100%;border:2px dashed #99f6e4;background:#f0fdfa;color:#0f766e;border-radius:11px;padding:11px;font-weight:800}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}.muted{font-size:12px;color:#64748b}
.totalbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.totalbox div{padding:12px;background:#f8fafc;border-radius:10px}.totalbox b{font-size:18px}
.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:11px;font-weight:800}.save{background:var(--main);color:#fff}.clear{background:#e2e8f0;color:#334155}
@media(max-width:500px){.entry{grid-template-columns:62px 1fr 88px 40px}.summary{grid-template-columns:1fr 1fr}.summary .stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>學校115廚餘總重紀錄表</h1>
  <div class="sub">手機版｜自動扣重、加總、計算淨重</div>
</header>
<div class="wrap">
  <div class="card controls">
    <div><label>月份</label><input id="month" type="number" min="1" max="12" placeholder="月"></div>
    <div><label>日期</label><input id="date" type="number" min="1" max="31" placeholder="日"></div>
  </div>

  <div class="card">
    <div class="daytabs" id="tabs"></div>
  </div>

  <div class="card">
    <div class="section-title"><span id="dayTitle">星期一</span><span class="muted">每筆輸入「組」與「重量」</span></div>
    <div id="entries"></div>
    <button class="add" onclick="addEntry()">＋ 新增一筆</button>
  </div>

  <div class="card">
    <div class="section-title"><span>本日統計</span><span class="muted">單位：公斤</span></div>
    <div class="summary">
      <div class="stat"><b id="gross">0.0</b><span>重量加總</span></div>
      <div class="stat"><b id="deduct">0.0</b><span>扣重加總</span></div>
      <div class="stat"><b id="net">0.0</b><span>廚餘淨重</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span>週一～週五總計</span><span class="muted">自動計算</span></div>
    <div class="totalbox">
      <div>重量加總<br><b id="weekGross">0.0 kg</b></div>
      <div>扣重加總<br><b id="weekDeduct">0.0 kg</b></div>
      <div>廚餘淨重<br><b id="weekNet">0.0 kg</b></div>
      <div>有紀錄天數<br><b id="daysCount">0 天</b></div>
    </div>
  </div>

  <div class="card actions">
    <button class="save" onclick="saveData()">💾 儲存</button>
    <button class="clear" onclick="clearAll()">🗑️ 清除全部</button>
  </div>
</div>

<script>
const days=["星期一","星期二","星期三","星期四","星期五"];
let current=0;
let data=JSON.parse(localStorage.getItem("foodWaste115")||"null") || days.map(()=>[]);
const month=localStorage.getItem("foodMonth")||""; const date=localStorage.getItem("foodDate")||"";
document.getElementById("month").value=month; document.getElementById("date").value=date;
document.getElementById("month").addEventListener("input",e=>localStorage.setItem("foodMonth",e.target.value));
document.getElementById("date").addEventListener("input",e=>localStorage.setItem("foodDate",e.target.value));

function renderTabs(){
  document.getElementById("tabs").innerHTML=days.map((d,i)=>`<button class="${i===current?'active':''}" onclick="switchDay(${i})">${d}${data[i].length?' · '+data[i].length+'筆':''}</button>`).join("");
}
function switchDay(i){current=i;renderTabs();render();}
function addEntry(){data[current].push({group:"",weight:""});saveData(false);render();}
function removeEntry(i){data[current].splice(i,1);saveData(false);render();}
function update(i,key,val){data[current][i][key]=val;saveData(false);renderTotals();}
function deduction(group){let n=parseInt(group,10); return Number.isFinite(n)&&n>=1&&n<=60?n*2.6:0;}
function render(){
 document.getElementById("dayTitle").textContent=days[current];
 document.getElementById("entries").innerHTML=data[current].map((e,i)=>`
 <div class="entry">
   <div class="group">第 ${i+1} 筆</div>
   <select onchange="update(${i},'group',this.value)">
     <option value="">選組別</option>
     ${Array.from({length:60},(_,k)=>`<option value="${k+1}" ${String(e.group)===String(k+1)?'selected':''}>${k+1}組（扣${(k+1)*2.6}）</option>`).join("")}
   </select>
   <input type="number" inputmode="decimal" step="0.1" min="0" placeholder="重量 kg" value="${e.weight}" oninput="update(${i},'weight',this.value)">
   <button onclick="removeEntry(${i})" aria-label="刪除">×</button>
 </div>`).join("");
 renderTotals(); renderWeek();
}
function calcDay(i){
 let gross=0,deduct=0;
 data[i].forEach(e=>{gross+=parseFloat(e.weight)||0;deduct+=deduction(e.group)});
 return {gross,deduct,net:gross-deduct};
}
function renderTotals(){
 const x=calcDay(current);
 document.getElementById("gross").textContent=x.gross.toFixed(1);
 document.getElementById("deduct").textContent=x.deduct.toFixed(1);
 document.getElementById("net").textContent=x.net.toFixed(1);
}
function renderWeek(){
 let g=0,d=0,n=0,c=0;
 data.forEach((_,i)=>{let x=calcDay(i);g+=x.gross;d+=x.deduct;n+=x.net;if(data[i].length)c++});
 document.getElementById("weekGross").textContent=g.toFixed(1)+" kg";
 document.getElementById("weekDeduct").textContent=d.toFixed(1)+" kg";
 document.getElementById("weekNet").textContent=n.toFixed(1)+" kg";
 document.getElementById("daysCount").textContent=c+" 天";
}
function saveData(show=true){
 localStorage.setItem("foodWaste115",JSON.stringify(data));
 if(show){localStorage.setItem("foodMonth",document.getElementById("month").value);localStorage.setItem("foodDate",document.getElementById("date").value);alert("已儲存！資料會保留在這支手機的瀏覽器中。");}
}
function clearAll(){
 if(confirm("確定要清除全部紀錄嗎？")){data=days.map(()=>[]);saveData(false);render();}
}
renderTabs();render();
</script>
</body>
</html>
